<!DOCTYPE html>
<html>
<head>

    <title>Birthday Party</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #fff0f5;
            color: #6b4050;
        }

        /* HALAMAN DEPAN */

        .home {
            height: 100vh;
            background: linear-gradient(#ffdce8, #fff5f8);
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .home h1 {
            font-size: 55px;
            color: #c5577d;
            margin-bottom: 10px;
        }

        .home h2 {
            font-size: 25px;
            letter-spacing: 5px;
            margin-bottom: 20px;
        }

        .home p {
            font-size: 18px;
        }

        .hiasan {
            font-size: 30px;
            margin-bottom: 20px;
        }


        /* BAGIAN FOTO */

        .foto-section {
            padding: 80px 20px;
            text-align: center;
        }

        .foto-section h2 {
            font-size: 35px;
            color: #c5577d;
            margin-bottom: 10px;
        }

        .foto-section p {
            margin-bottom: 40px;
        }

        .foto-container {
            max-width: 800px;
            margin: auto;
        }

        .foto {
            margin-bottom: 30px;
        }

        .foto img {
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            box-shadow: 0 5px 15px #d9aab9;
        }


        /* UCAPAN */

        .closing {
            min-height: 70vh;
            background-color: #ffdce8;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

        .closing h2 {
            font-size: 40px;
            color: #c5577d;
            margin-bottom: 20px;
        }

        .closing p {
            font-size: 18px;
            line-height: 1.8;
        }

        .love {
            font-size: 35px;
            margin-top: 20px;
        }


        /* HP */

        @media (max-width: 600px) {

            .home h1 {
                font-size: 40px;
            }

            .home h2 {
                font-size: 20px;
            }

            .foto-section h2 {
                font-size: 30px;
            }

            .closing h2 {
                font-size: 32px;
            }

        }

    </style>

</head>


<body>


    <!-- HALAMAN DEPAN -->

    <section class="home">

        <div>

            <div class="hiasan">
                🎀 ✨ 🎂 ✨ 🎀
            </div>

            <h1>
                Birthday Party
            </h1>

            <h2>
                HELINDA
            </h2>

            <p>
                01 • 01 • 2027
            </p>

            <div class="hiasan">
                ♡
            </div>

            <p>
                Scroll down ↓
            </p>

        </div>

    </section>



    <!-- BAGIAN FOTO -->

    <section class="foto-section">

        <h2>
            My Moments 📸
        </h2>

        <p>
            A little collection of my favorite moments ♡
        </p>


        <div class="foto-container">


            <!-- FOTO 1 -->

            <div class="foto">

                <img src="c:\Users\acer\OneDrive\Python\HTML\BIRTHDAY\foto1.jpg.jpeg">

            </div>

        </div>

    </section>



    <!-- BAGIAN TERAKHIR -->

    <section class="closing">

        <div>

            <h2>
                Let's Celebrate! 🎂
            </h2>

            <p>
                Thank you for being part of<br>
                my special day.
            </p>

            <div class="love">
                ♡ ♡ ♡
            </div>

            <p>
                With love,<br>
                <b>Helinda</b>
            </p>

        </div>

    </section>


</body>

</html>
